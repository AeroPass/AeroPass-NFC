name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend (NestJS) - compilar y probar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Validar tipos (lint)
        run: npm run lint
      - name: Compilar
        run: npm run build
      - name: Ejecutar todas las pruebas con cobertura
        run: npm test -- --ci --coverage
      - name: Subir reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-backend
          path: backend/coverage

  agente-nfc:
    name: Agente NFC (Python) - pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agente-nfc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: agente-nfc/requirements.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Ejecutar pruebas
        run: python -m unittest discover -s tests -t . -v
